name: CI

# Full checks on every pull request and on main. Work-branch pushes can use
# "[preview-only]" in the commit message for a quick untested Windows build.
# See docs/RELEASING.md.

on:
  pull_request:
  push:
    branches: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  checks:
    if: ${{ !(github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[preview-only]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cleanverse
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            output: build/windows/x64/runner/Release/
          - target: macos
            os: macos-latest
            output: build/macos/Build/Products/Release/cleanverse.app
          - target: linux
            os: ubuntu-22.04
            output: build/linux/x64/release/bundle/
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cleanverse
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - name: Upload test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CLEANVerse-${{ matrix.target }}-pr${{ github.event.pull_request.number }}
          path: apps/cleanverse/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  preview:
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[preview-only]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cleanverse
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows
      - name: Upload untested Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: CLEANVerse-Windows-untested-${{ github.sha }}
          path: apps/cleanverse/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
