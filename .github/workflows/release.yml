name: Release

# Push a tag like v1.2.0 (matching pubspec.yaml) to build all desktop
# platforms and create a DRAFT release with a signed latest.json. Tags with
# a "-" (v1.2.0-beta.1) become pre-releases, which auto-update ignores.
# Review the draft, then publish it. See docs/RELEASING.md.
#
# Required settings:
#   secret   UPDATE_SIGNING_KEY  Ed25519 private key (tool/release/sign_manifest.dart keygen)
#   variable UPDATE_PUBLIC_KEY   matching public key, compiled into the app
# Optional (macOS Developer ID signing + notarization; unsigned without them):
#   secrets  MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match pubspec version
        run: |
          version=$(grep -E '^version:' apps/cleanverse/pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/' | tr -d '\r')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version $version" >&2
            exit 1
          fi
          if [ -z "${{ vars.UPDATE_PUBLIC_KEY }}" ]; then
            echo "Repository variable UPDATE_PUBLIC_KEY is missing" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/cleanverse
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  build:
    needs: [verify, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cleanverse
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release --dart-define=CLEANVERSE_UPDATE_KEY=${{ vars.UPDATE_PUBLIC_KEY }}
      - name: Import Developer ID certificate
        id: cert
        if: matrix.target == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::macOS signing secrets are not set; the DMG will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain"
          # shellcheck disable=SC2046  # keychain list is intentionally split
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Sign app (hardened runtime)
        if: matrix.target == 'macos' && steps.cert.outputs.signed == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          app=build/macos/Build/Products/Release/cleanverse.app
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements --sign "$IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
      - name: Package
        run: |
          v=${{ needs.verify.outputs.version }}
          mkdir -p ../../dist
          case "${{ matrix.target }}" in
            windows)
              (cd build/windows/x64/runner/Release && 7z a -tzip "../../../../../../../dist/CLEANVerse-$v-windows-x64.zip" .) ;;
            macos)
              hdiutil create -volname CLEANVerse -srcfolder build/macos/Build/Products/Release/cleanverse.app \
                -ov -format UDZO "../../dist/CLEANVerse-$v-macos-universal.dmg"
              if [ "${{ steps.cert.outputs.signed }}" != "true" ]; then
                echo "macOS build is unsigned and not notarized." > ../../dist/UNSIGNED-macos.txt
              fi ;;
            linux)
              tar -C build/linux/x64/release/bundle -czf "../../dist/CLEANVerse-$v-linux-x64.tar.gz" . ;;
          esac
      - name: Notarize and staple DMG
        if: matrix.target == 'macos' && steps.cert.outputs.signed == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg=$(ls ../../dist/CLEANVerse-*-macos-universal.dmg)
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Sign manifest
        working-directory: apps/cleanverse
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "UPDATE_SIGNING_KEY secret is missing" >&2; exit 1; }
          flutter pub get
          dart run tool/release/sign_manifest.dart manifest \
            --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" \
            --version "${{ needs.verify.outputs.version }}" \
            --notes "See the release page for details." \
            --out ../../dist ../../dist/CLEANVerse-*
          (cd ../../dist && sha256sum CLEANVerse-* latest.json > SHA256SUMS.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Review every package before publishing."
          if [ -f dist/UNSIGNED-macos.txt ]; then
            notes="$notes

          > **macOS build is unsigned and not notarized.** Gatekeeper will block it. Do not publish as a full release until signing secrets are configured (docs/RELEASING.md)."
            rm dist/UNSIGNED-macos.txt
          fi
          pre=""
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          gh release create "${{ github.ref_name }}" dist/* \
            --verify-tag --draft --generate-notes $pre --notes "$notes" \
            --title "CLEANVerse ${{ needs.verify.outputs.version }}"
