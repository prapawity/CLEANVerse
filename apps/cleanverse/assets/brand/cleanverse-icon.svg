<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="CLEANVerse app icon">
<title>CLEANVerse - Swept Orbit app icon</title>
<defs>
 <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d45"/><stop offset="1" stop-color="#141626"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
 <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2d4ff"/><stop offset=".55" stop-color="#c2a7f5"/><stop offset="1" stop-color="#7a5fc4"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#73d5fb" stop-opacity=".15"/><stop offset=".55" stop-color="#73d5fb"/><stop offset="1" stop-color="#d9f6ff"/></linearGradient>
 <clipPath id="front"><rect x="0" y="512" width="1024" height="512"/></clipPath>
 <clipPath id="swept"><circle cx="512" cy="512" r="210"/></clipPath>
</defs>
<!-- soft drop shadow (stacked, renderer-independent) -->
<rect x="100" y="124" width="824" height="824" rx="185" fill="#000" opacity=".10"/>
<rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity=".14"/>
<rect x="100" y="106" width="824" height="824" rx="185" fill="#000" opacity=".18"/>
<!-- tile -->
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)"/>
<rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
<!-- planet: the half the orbit has already swept is bright, the rest is still dusty -->
<circle cx="512" cy="512" r="210" fill="#4a4270"/>
<g clip-path="url(#swept)" transform="rotate(-24 512 512)">
 <circle cx="452" cy="380" r="16" fill="#6e639c"/>
 <circle cx="560" cy="350" r="11" fill="#6e639c"/>
 <circle cx="640" cy="420" r="13" fill="#6e639c"/>
 <rect x="200" y="470" width="640" height="300" fill="url(#planet)"/>
</g>
<g transform="rotate(-24 512 512)">
 <!-- back half of ring is hidden by the planet; front half drawn over it -->
 <g clip-path="url(#front)">
  <ellipse cx="512" cy="512" rx="350" ry="118" fill="none" stroke="url(#ring)" stroke-width="54" stroke-linecap="round"/>
 </g>
 <!-- leading particle -->
 <circle cx="862" cy="512" r="40" fill="#d9f6ff"/>
</g>
</svg>
